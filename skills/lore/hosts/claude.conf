# lore host adapter: Claude Code. Checked 2026-10-16 against Claude Code 2.1.300 docs.
name: claude
home_dir: ~/.claude
global_file: ~/.claude/CLAUDE.md
mode: import
import: @{index}
hooks_file: ~/.claude/settings.json
hooks_format: claude
hook_events: SessionEnd,PreCompact,SessionStart
turn_events:
transcript_key: transcript_path
session_key: session_id
transcript_format: claude
transcript_glob: ~/.claude/projects/*/*.jsonl
# Default models (change them here): extract haiku at low effort, review opus at high.
extract: claude -p --model haiku --effort low --no-session-persistence --settings '{"disableAllHooks":true}' --output-format text < "$LORE_PROMPT_FILE"
review: claude -p --model opus --effort high --no-session-persistence --settings '{"disableAllHooks":true}' --output-format text < "$LORE_PROMPT_FILE"
