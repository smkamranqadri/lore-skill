# lore host adapter: Codex. Checked 2026-10-16 against Codex 0.155.1; AGENTS.md has no imports
# and Codex caps the combined instruction files at 32 KiB.
name: codex
home_dir: ~/.codex
global_file: ~/.codex/AGENTS.md
mode: block
max_bytes: 32768
# Codex skips hooks it has not trusted: the user opens /hooks once in Codex after install.
hooks_file: ~/.codex/hooks.json
hooks_format: claude
hook_events: SessionEnd,PreCompact,SessionStart
turn_events:
transcript_key: transcript_path
session_key: session_id
transcript_format: codex
transcript_glob: ~/.codex/sessions/*/*/*/rollout-*.jsonl
# Default models (change them here): extract gpt-6-astra at low effort, review gpt-6.1-sol at high.
extract: codex exec --ephemeral --disable hooks -s read-only --skip-git-repo-check -m gpt-6-astra -c model_reasoning_effort=low - < "$LORE_PROMPT_FILE"
review: codex exec --ephemeral --disable hooks -s read-only --skip-git-repo-check -m gpt-6.1-sol -c model_reasoning_effort=high - < "$LORE_PROMPT_FILE"
