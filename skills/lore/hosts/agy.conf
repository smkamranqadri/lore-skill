# lore host adapter: agy (Google Antigravity CLI). Checked 2026-10-16 against agy 1.4.0 docs.
# Its @[label](path) import is unverified live, so the index is copied in. Gemini CLI reads the
# same GEMINI.md.
name: agy
home_dir: ~/.gemini
global_file: ~/.gemini/GEMINI.md
mode: block
# agy has no session-end hook; Stop fires every turn. Hooks are keyed by a hook name.
hooks_file: ~/.gemini/config/hooks.json
hooks_format: agy
hook_events: Stop,SessionStart
turn_events: Stop
transcript_key: transcriptPath
session_key: conversationId
transcript_format: agy
transcript_glob: ~/.gemini/antigravity-cli/brain/*/.system_generated/logs/transcript.jsonl
# Default model (change it here): Gemini 3.8 Flash (High).
# -p takes the next argument as the prompt, so the prompt comes right after it (checked 2026-10-16).
extract: agy -p "$(cat "$LORE_PROMPT_FILE")" --model "Gemini 3.8 Flash (High)" --print-timeout 120s --output-format text
