# lore host adapter: Command Code. Checked 2026-10-16 against cmd 1.82.5 shipped docs
# (@path imports, up to five levels).
name: cmd
home_dir: ~/.commandcode
global_file: ~/.commandcode/AGENTS.md
mode: import
import: @{index}
# cmd has no session-end hook; Stop fires every turn, so its sessions wait until idle.
# Transcript entry schema unverified (no sample yet): the generic user-message reader is used.
hooks_file: ~/.commandcode/settings.json
hooks_format: claude
hook_events: Stop,SessionStart
turn_events: Stop
transcript_key: transcript_path
session_key: session_id
transcript_format: generic
transcript_glob: ~/.commandcode/projects/*/*.jsonl
# Default model (change it here): z-ai/glm-5.3-flash at low effort.
extract: cmd -p -m z-ai/glm-5.3-flash --effort low --skip-onboarding --no-session --max-turns 1 < "$LORE_PROMPT_FILE"
