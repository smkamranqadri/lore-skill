name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux only for now: the test scripts use GNU sed, touch and date. lore itself runs on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every suite
        run: tests/run.sh

  ui:
    # The ui/ app: its bundle in skills/lore/ui/dist must be what ui/ builds, and Playwright drives
    # the real `lore ui` on a fictional store (python3 and git come with the runner).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: The committed bundle is the build of ui/
        run: npm run check-dist
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
